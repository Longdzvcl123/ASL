[project]
name = "asl-translation"
version = "1.0.0"
description = "Real-time American Sign Language (ASL) alphabet recognition with MediaPipe hand landmarks and PyTorch"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["safe"]
addopts = "-ra"

[tool.coverage.run]
source = ["safe"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["safe", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
